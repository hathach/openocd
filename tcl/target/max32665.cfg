# MAX32665/MAX32666 for mainline OpenOCD.
# Ported from the Analog Devices fork: identical flash geometry, sourcing
# mainline's max32xxx_common.cfg -- the fork calls that same file max32xxx.cfg.
# The fork's QSPI block is dropped: it is guarded by QSPI_ENABLE, which this
# part sets to 0, and it needs the ADI-only max32xxx_qspi driver.
reset_config srst_only
adapter srst delay 200

set CHIPNAME max32665
set FLASH_BASE 0x10000000
set FLASH_SIZE 0x80000
set FLC_BASE 0x40029000
set FLASH_SECTOR 0x2000
set FLASH_CLK 96
set FLASH_OPTIONS 0x01

transport select swd
source [find target/max32xxx_common.cfg]

# second flash bank
set FLASH_BASE 0x10080000
set FLC_BASE 0x40029400
flash bank $_CHIPNAME.flash1 max32xxx $FLASH_BASE $FLASH_SIZE 0 0 $_CHIPNAME.cpu \
$FLC_BASE $FLASH_SECTOR $FLASH_CLK $FLASH_OPTIONS
