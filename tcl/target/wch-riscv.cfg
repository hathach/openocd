#
# WCH CH32V / CH5xx QingKe RISC-V over the wlinke adapter's JTAG DTM
# emulation, driven by mainline's generic riscv target.
#
# The WCH-Link probe exposes the RISC-V Debug Module directly; the adapter
# presents it as a standard JTAG DTM. Flashing goes through the probe's
# proprietary protocol (wch_riscv flash driver).
#
# Standard resets do not work on these parts: the debug module does not
# survive ndmreset over the single-wire link. Use the probe-mediated
# commands instead:
#   wlink_reset_run    - reset the chip and let it run
#   wlink_reset_halt   - reset the chip and hold it halted
# A typical flash sequence:
#   init; halt; flash write_image erase fw.elf; wlink_reset_run; shutdown

transport select jtag

if { [info exists CHIPNAME] } {
	set _CHIPNAME $CHIPNAME
} else {
	set _CHIPNAME ch32
}

jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x00001

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME
$_TARGETNAME configure -work-area-phys 0x20000000 -work-area-size 0x2800 -work-area-backup 1

set _FLASHNAME $_CHIPNAME.flash
flash bank $_FLASHNAME wch_riscv 0x00000000 0 0 0 $_TARGETNAME
